[project]
name = "sateri"
version = "0.1.0"
description = "Backend scaffold for the Sateri project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Django==6.0.*",
  "djangorestframework",
  "djangorestframework-simplejwt",
  "django-cors-headers",
  "python-decouple==3.8",
  "psycopg[binary]",
  "celery",
  "redis",
  "stripe",
  "resend",
  "structlog",
  "gunicorn",
  "httpx",
]

[dependency-groups]
dev = [
  "ruff",
  "mypy",
  "pytest",
  "pytest-django",
  "pytest-cov",
  "factory-boy",
  "django-debug-toolbar",
  "django-stubs",
  "djangorestframework-stubs",
  "pre-commit",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "S", "A", "C4", "DTZ", "DJ", "T20", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
module = ["*.migrations.*"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
